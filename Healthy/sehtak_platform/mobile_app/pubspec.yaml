name: sehtak
version: 1.0.0+1
publish_to: 'none'
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_bloc: ^8.1.3
  go_router: ^11.1.4
  dio: ^5.3.3
  retrofit: ^4.0.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  web_socket_channel: ^2.4.0
  google_maps_flutter: ^2.5.0
  flutter_local_notifications: ^16.1.0
  firebase_messaging: ^14.7.2
  firebase_core: ^2.21.0
  agora_rtc_engine: ^6.2.4
  image_picker: ^1.0.7
  permission_handler: ^11.0.1
  path_provider: ^2.1.1
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  url_launcher: ^6.2.1
  share_plus: ^7.2.1
  intl: ^0.18.1
  logger: ^2.0.2+1

dependency_overrides:
  win32: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.6
  retrofit_generator: ^8.0.4
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
