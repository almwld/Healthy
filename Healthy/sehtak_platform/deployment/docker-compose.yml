version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sehtak-postgres
    environment:
      POSTGRES_DB: sehtak_db
      POSTGRES_USER: sehtak_user
      POSTGRES_PASSWORD: sehtak_password_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/migrations/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../backend/migrations/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5432:5432"
    networks:
      - sehtak-network

  redis:
    image: redis:7-alpine
    container_name: sehtak-redis
    ports:
      - "6379:6379"
    networks:
      - sehtak-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sehtak-backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sehtak_db
      - DB_USER=sehtak_user
      - DB_PASSWORD=sehtak_password_2024
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=sehtak_super_secret_key_2024_change_in_production
      - JWT_EXPIRES_IN=7d
      - PORT=3000
      - NODE_ENV=production
      - AI_SERVICE_URL=http://ai_service:8000
      - FRONTEND_URL=http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - sehtak-network
    restart: unless-stopped

  ai_service:
    build:
      context: ../ai_service
      dockerfile: Dockerfile
    container_name: sehtak-ai
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    networks:
      - sehtak-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: sehtak-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - ai_service
    networks:
      - sehtak-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  sehtak-network:
    driver: bridge
